<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error {color: red; font-size: 0.8em; margin-bottom: 10px;}
        .edit-form-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 0;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .form-header {
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-body {
            padding: 20px 80px;
            text-align: center;
        }
        .form-footer {
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            text-align: right;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .form-control, .form-select {
            display: block;
            width: 100%;
        }
        select[multiple] {
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 p-2 text-white">
     <div>
    Вы вошли как: <b sec:authentication="name">Имя</b> |
    Роли: <span th:each="authority : ${#authentication.getAuthorities()}">
         <i th:text="${authority.getAuthority().replace('ROLE_', '').replace('FACTOR_PASSWORD', '') + ' '}"></i>
     </span>
</div>
<form th:action="@{/logout}" method="post" style="margin-top: 20px;">
    <button type="submit" style="cursor:pointer;">Выйти</button>
</form>
</nav>

<div class="edit-form-container shadow-sm">
    <div class="form-header">
        <button type="button" class="btn-close" aria-label="Close" onclick="window.location.href='/admin'"></button>
<h2>Редактировать пользователя</h2>
    </div>

<form th:method="PATCH" th:action="@{/admin/{id}(id=${user.id})}" th:object="${user}" method="post">
    <div class = "form-body">

    <input type="hidden" th:field="*{id}" />

    <label for="id">ID</label>
    <input type="text" th:field="*{id}" id="id" class="form-control form-control-static" readonly />

    <label for="username">Никнейм:</label>
    <input type="text" th:field="*{username}" id="username" class="form-control"/>
    <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

    <label for="password">Новый пароль (оставьте пустым, если не хотите менять):</label>
    <input type="password" name="password" id="password" class="form-control"/>

    <label for="name">Имя</label>
    <input type="text" th:field="*{name}" id="name" class="form-control"/>
    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка имени</div>

    <label for="lastName">Фамилия</label>
    <input type="text" th:field="*{lastName}" id="lastName" class="form-control"/>
    <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Ошибка фамилии</div>

    <label for="age">Возраст:</label>
    <input type="number" th:field="*{age}" id="age" class="form-control"/>
    <div class="text-danger small" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Ошибка возраста</div>

    <label for="email">Email:</label>
    <input type="email" th:field="*{email}" id="email" class="form-control" required/>
    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Ошибка email</div>

    <label for="roles">Роли:</label>
    <select th:field="*{roles}" id="roles" name='roles' class="form-select" multiple size="2">
        <option th:each="role : ${roles}"
                th:value="${role.id}"
                th:text="${role.name.replace('ROLE_','')}">Название Роли</option>
    </select>
</div>
    <div class="form-footer">
        <a th:href="@{/admin}" class="btn btn-secondary">Закрыть</a>
        <button type="submit" class="btn btn-primary px-4">Редактировать</button>
    </div>
</form>
</div>

</body>
</html>
