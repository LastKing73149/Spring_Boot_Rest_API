<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa;}
        .sidebar { min-height: calc(100vh - 56px);
            background-color: white;
            border-right: 1px solid #dee2e6;
            padding-top: 20px;
        }
        .nav-pills .nav-link { border-radius: 0.25rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-2 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand">
                <strong> Вы вошли как: <b sec:authentication="name">Имя</b> |</strong>
    Роли: <span th:each="authority : ${#authentication.getAuthorities()}">
         <i th:text="${authority.getAuthority().replace('ROLE_', '').replace('FACTOR_PASSWORD', '') + ' '}"></i>
     </span>
</span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-danger text-decoration-none">Выйти из системы</button>
            </form>
        </div>
</nav>

<div class = "container-fluid">
    <div class = "row">
        <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse pe-0" style="min-height: calc(100vh - 48px); box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);">
            <div class="position-sticky">
                <ul class = "nav nav-pills flex-column px-3">
                <li class= "nav-item" sec:authorize = "hasRole('ADMIN')">
                    <a class = "nav-link text-center" th:href = "@{/admin}">Admin</a>
                </li>
                <li class = "nav-item mt-1">
                    <a class = "nav-link active text-center" th:href = "@{/user}">User</a>
                </li>
            </ul>
      </div>
</nav>

<main class= "col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">
    <h1 class="h2 mb-4">Информация о пользователе</h1>

    <div class="card shadow-sm">
        <div class="card-header bg-light py-3">
            <h5 class="mb-0">О пользователе</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0 align-middle">
        <tr>
            <th>ID:</th>
            <td th:text="${user.id}"></td>
        </tr>
        <tr>
            <th>Никнейм:</th>
            <td th:text="${user.username}"></td>
        </tr>
        <tr>
            <th>Имя:</th>
            <td th:text="${user.name}"></td>
        </tr>
        <tr>
            <th>Фамилия:</th>
            <td th:text="${user.lastName}"></td>
        </tr>
        <tr>
            <th>Возраст:</th>
            <td th:text="${user.age}"></td>
        </tr>
        <tr>
            <th>Email:</th>
            <td th:text="${user.email}"></td>
        </tr>
        <tr>
            <th>Ваша роль:</th>
            <td>
                <span th:each="role : ${user.roles}" th:text="${role.name.replace('ROLE_', '') + ''}"></span>
                                            </td>
                                        </tr>
                                </table>
                          </div>
                    </div>
            </main>
      </div>
</div>

</body>
</html>
