<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa;}
        .sidebar { min-height: calc(100vh - 56px);
            background-color: white;
            border-right: 1px solid #dee2e6;
            padding-top: 20px;
        }
        .nav-pills .nav-link { border-radius: 0.25rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white">
            Панель пользователя
        </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-danger text-decoration-none">Выйти из системы</button>
            </form>
        </div>
</nav>

<div class="container pt-5">
    <div class="row">

<main class= "col-md-8 col-lg-6 mx-auto">
    <h1 class="h2 mb-4 text-center">Информация о пользователе</h1>

    <div class="card shadow-sm">
        <div class="card-header bg-light py-3">
            <h5 class="mb-0 fw-bold text-center">О пользователе</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0 align-middle">
                <tbody>
        <tr>
            <th>ID:</th>
            <td th:text="${user.id}"></td>
        </tr>
        <tr>
            <th>Никнейм:</th>
            <td th:text="${user.username}"></td>
        </tr>
        <tr>
            <th>Имя:</th>
            <td th:text="${user.name}"></td>
        </tr>
        <tr>
            <th>Фамилия:</th>
            <td th:text="${user.lastName}"></td>
        </tr>
        <tr>
            <th>Возраст:</th>
            <td th:text="${user.age}"></td>
        </tr>
        <tr>
            <th>Email:</th>
            <td th:text="${user.email}"></td>
        </tr>
        <tr>
            <th>Ваша роль:</th>
            <td>
                <span th:each="role : ${user.roles}" th:text="${role.name.replace('ROLE_', '') + ''}"></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                          </div>
                    </div>
            </main>
      </div>
</div>

</body>
</html>
